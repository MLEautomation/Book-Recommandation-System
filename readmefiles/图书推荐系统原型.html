<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图书推荐系统 · 原型</title>
<style>
/* ============================================================
   1. 基础与变量
   ============================================================ */
:root{
  --primary:#2E5C8A;
  --primary-dark:#24466b;
  --primary-soft:#e9f0f8;
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#1f2933;
  --text-2:#3a4753;
  --muted:#6b7a88;
  --line:#e4e9ef;
  --danger:#c0392b;
  --ok:#2e8b57;
  --warn:#b7791f;
  --radius:12px;
  --shadow:0 2px 10px rgba(31,41,51,.07);
  --shadow-hover:0 8px 22px rgba(31,41,51,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:14px/1.65 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0 0 10px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
ul{margin:0;padding:0;list-style:none}

/* ============================================================
   2. 顶部菜单
   ============================================================ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:100;
  background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(31,41,51,.05);
}
.topbar-inner{
  max-width:1200px;height:100%;margin:0 auto;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;color:var(--primary);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--primary),#7fa6c9);
  color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;
}
.nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.nav a{padding:7px 13px;border-radius:8px;color:var(--text-2);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--primary-soft);text-decoration:none}
.nav a.active{background:var(--primary);color:#fff}
.nav .who{color:var(--muted);font-size:13px;padding:0 6px;white-space:nowrap}
.nav .who b{color:var(--primary)}

main{padding-top:60px;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:22px 20px 70px}

/* ============================================================
   3. 通用组件
   ============================================================ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
.page-head h1{font-size:22px}
.page-head .sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:17px;display:flex;align-items:center;gap:8px}
.section-head h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6}
.divider{height:1px;background:var(--line);margin:18px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:9px;border:1px solid transparent;font-weight:600;transition:.16s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{border-color:#cbd8e5;color:var(--primary);background:#fff}
.btn-outline:hover{background:var(--primary-soft)}
.btn-ghost{background:#f1f4f8;color:var(--text-2)}
.btn-ghost:hover{background:#e7ecf3}
.btn-danger{background:#fdecea;color:var(--danger)}
.btn-danger:hover{background:#fbd9d5}
.btn-sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-xs{height:26px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn[disabled],.btn.is-disabled{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}

.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;background:#f1f4f8;color:var(--text-2);font-size:13px;border:1px solid transparent;transition:.14s}
.chip.on{background:var(--primary);color:#fff}
.tag-chip{cursor:pointer}
.tag-chip:hover{background:#e7edf5}
.tag-chip.on:hover{background:var(--primary-dark)}
.chip-sm{height:22px;padding:0 8px;font-size:11.5px;border-radius:11px;background:#f2f5f9;color:var(--muted)}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.badge.gray{background:#eef1f5;color:var(--muted)}
.badge.warn{background:#fdf3e2;color:var(--warn)}
.badge.danger{background:#fdecea;color:var(--danger)}
.badge.ok{background:#e8f5ec;color:var(--ok)}

/* 表单 */
.field{margin-bottom:15px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:13.5px}
.input{
  width:100%;height:40px;padding:0 12px;border:1px solid #d8e0e9;border-radius:9px;background:#fff;
  transition:.15s;outline:none;
}
textarea.input{height:auto;min-height:84px;padding:10px 12px;line-height:1.6;resize:vertical}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,92,138,.12)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.err-msg{color:var(--danger);font-size:12.5px;margin-top:5px}
.with-btn{display:flex;gap:8px}
.with-btn .input{flex:1}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.pager button{
  min-width:36px;height:34px;padding:0 11px;border-radius:8px;background:#fff;
  border:1px solid var(--line);color:var(--text-2);font-size:13px;font-weight:500;transition:.15s;
}
.pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pager button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{color:#c2ccd8;background:#f7f9fb;cursor:not-allowed}
.pager .info{color:var(--muted);font-size:12.5px;margin-left:6px}

/* Toast */
#toasts{position:fixed;top:74px;right:20px;z-index:400;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{
  background:#20303f;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;
  box-shadow:0 10px 28px rgba(16,24,32,.24);max-width:340px;animation:toastIn .18s ease;
  pointer-events:auto;line-height:1.55;
}
.toast a{color:#9ecbf7;font-weight:600;margin-left:4px}
.toast.ok{background:#23684a}
.toast.err{background:#8f2d22}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* 弹窗 */
#modal-root{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(16,24,32,.45);padding:20px}
#modal-root.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(16,24,32,.3);width:min(430px,94vw);padding:22px 22px 18px;animation:modalIn .16s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;margin-bottom:8px}
.modal .mbody{color:var(--text-2);font-size:13.5px;line-height:1.7;margin-bottom:16px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px}

/* ============================================================
   4. 封面与图书卡片
   ============================================================ */
.cover{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:inset 0 0 40px rgba(0,0,0,.16);
}
.cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(0,0,0,.26));
}
.cover .init{
  position:relative;z-index:1;font-size:40px;font-weight:800;letter-spacing:2px;
  text-shadow:0 3px 12px rgba(0,0,0,.32);
}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22);z-index:1}
.cover .tagline{
  position:absolute;left:0;right:0;bottom:0;z-index:1;padding:26px 10px 9px;
  font-size:11.5px;letter-spacing:.5px;background:linear-gradient(transparent,rgba(0,0,0,.45));color:rgba(255,255,255,.92);
}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.bcard{
  background:#fff;border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);
  cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:9px;
}
.bcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.bcard .btitle{font-weight:700;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bauthor{color:var(--muted);font-size:12.5px;margin-top:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .btags{display:flex;gap:5px;flex-wrap:wrap}
.bcard .bfoot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fav-btn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:7px;background:#f2f5f9;color:var(--text-2);font-size:12.5px}
.fav-btn.on{background:#fdf3e2;color:#b7791f}
.fav-btn:hover{filter:brightness(.96)}
.count{color:var(--muted);font-size:12px}

/* ============================================================
   5. 首页筛选
   ============================================================ */
.filter-box{display:flex;flex-direction:column;gap:12px}
.filter-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.filter-row .ftype{color:var(--muted);font-size:13px;font-weight:600;padding-top:3px}
.filter-vals{display:flex;gap:8px;flex-wrap:wrap}
.selected-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.selected-bar .label{color:var(--muted);font-size:13px;font-weight:600}
.chip-x{cursor:pointer;background:var(--primary-soft);color:var(--primary)}
.chip-x .x{opacity:.65;font-weight:700}

/* ============================================================
   6. 榜单
   ============================================================ */
.rank-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rank-tabs button{
  height:36px;padding:0 18px;border-radius:9px;background:#fff;border:1px solid var(--line);
  color:var(--text-2);font-weight:600;transition:.15s;
}
.rank-tabs button:hover{border-color:var(--primary);color:var(--primary)}
.rank-tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.rank-note{
  display:flex;gap:8px;align-items:flex-start;background:#f8fbfe;border:1px solid #dbe7f2;
  border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--text-2);
}
.rank-note b{color:var(--primary)}
.rrow{
  display:grid;grid-template-columns:56px 70px 1fr;gap:16px;align-items:center;
  background:#fff;border-radius:11px;padding:12px 16px;margin-bottom:10px;cursor:pointer;
  border:1px solid transparent;box-shadow:0 1px 4px rgba(31,41,51,.05);transition:.15s;
}
.rrow:hover{background:#f9fcff;border-color:#cfe0f0;transform:translateX(2px)}
.rrow .rank{font:800 26px/1 Georgia,"Times New Roman",serif;color:#9aa7b4;text-align:center}
.rrow .rank.r1{color:#d4a017}
.rrow .rank.r2{color:#8d9aa8}
.rrow .rank.r3{color:#bf7f4e}
.rrow .rcover{width:70px;aspect-ratio:3/4;border-radius:7px}
.rrow .rcover .init{font-size:22px}
.rrow .rtitle{font-weight:700;font-size:15.5px;margin-bottom:3px}
.rrow .rmeta{color:var(--muted);font-size:12.5px;margin-bottom:5px}
.rrow .rval{font-size:12.5px;color:var(--primary);font-weight:600}

/* ============================================================
   7. 图书详情
   ============================================================ */
.detail-top{display:grid;grid-template-columns:210px 1fr;gap:26px}
.detail-top .cover{max-width:210px}
.detail-info h1{font-size:24px;margin-bottom:6px}
.detail-info .byline{color:var(--muted);margin-bottom:16px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 22px;margin-bottom:14px}
.meta-grid .mi{display:flex;gap:8px;font-size:13px}
.meta-grid .mk{color:var(--muted);flex:0 0 62px}
.meta-grid .mv{color:var(--text-2);font-weight:500}
.tag-groups{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.tag-line{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;font-size:13px}
.tag-line .tl{color:var(--muted);font-weight:600}
.tag-line .tv{display:flex;gap:6px;flex-wrap:wrap}
.act-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act-btn{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:9px;
  background:#fff;border:1px solid #d8e0e9;font-weight:600;transition:.15s;
}
.act-btn:hover{border-color:var(--primary);color:var(--primary);background:#f8fbff}
.act-btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.act-btn.on.neg{background:#c0392b;border-color:#c0392b}
.act-btn.on.pos{background:#2e8b57;border-color:#2e8b57}
.act-btn[disabled]{opacity:.5;cursor:not-allowed}

/* 评论 */
.cmt-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px}
.seg button{height:30px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(31,41,51,.12)}
.comment{display:grid;grid-template-columns:36px 1fr;gap:11px;padding:14px 0;border-bottom:1px solid #eff2f6}
.comment:last-child{border-bottom:none}
.avatar{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:15px;flex:0 0 36px;
}
.avatar.gr{background:#e8f5ec;color:#2e8b57}
.avatar.am{background:#fdf3e2;color:#b7791f}
.cmt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.cmt-user{font-weight:700;font-size:13.5px}
.cmt-time{color:var(--muted);font-size:12px}
.cmt-body{color:var(--text-2);margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.cmt-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.act-mini{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:7px;color:var(--muted);font-size:12.5px;transition:.14s}
.act-mini:hover{background:#f1f4f8;color:var(--primary)}
.act-mini.on.like{background:#e8f5ec;color:#2e8b57}
.act-mini.on.dis{background:#fdecea;color:var(--danger)}
.act-mini[disabled]{opacity:.5;cursor:not-allowed}
.replies{margin-top:10px;padding-left:12px;border-left:2px solid #eef2f7;display:flex;flex-direction:column;gap:2px}
.replies .comment{grid-template-columns:28px 1fr;padding:10px 0;border-bottom:none}
.replies .avatar{width:28px;height:28px;flex:0 0 28px;font-size:12px}
.pinned-bar{
  display:flex;align-items:center;gap:10px;margin:6px 0 2px;padding:12px 0 6px;
  border-top:2px dashed #e6c9a8;color:#a9762a;font-size:13px;font-weight:600;
}
.pinned-bar .ico{width:22px;height:22px;border-radius:50%;background:#fdf3e2;display:flex;align-items:center;justify-content:center;font-size:12px}
.pinned{background:#fffdf8;border:1px solid #f2e3cd;border-radius:10px;padding:0 14px;margin-bottom:10px}
.cmt-editor{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:18px}
.cmt-editor .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.reply-box{margin-top:10px}

/* ============================================================
   8. 登录 / 注册
   ============================================================ */
.auth-wrap{max-width:420px;margin:36px auto 0}
.auth-card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(31,41,51,.1);padding:30px 30px 24px}
.auth-card h1{font-size:20px;text-align:center;margin-bottom:6px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.pwd-wrap{position:relative}
.pwd-wrap .input{padding-right:44px}
.eye{position:absolute;right:6px;top:0;height:40px;width:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;border-radius:8px}
.eye:hover{background:#f1f4f8}
.captcha-wrap{display:flex;gap:10px}
.captcha-wrap .input{flex:1}
#captchaCanvas{border:1px solid #d8e0e9;border-radius:9px;cursor:pointer;background:#f7fafd;flex:0 0 auto}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:13px;color:var(--text-2)}
.switch .track{width:38px;height:21px;border-radius:11px;background:#cfd8e3;position:relative;transition:.16s;flex:0 0 38px}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on .track{background:var(--primary)}
.switch.on .track::after{transform:translateX(17px)}
.auth-foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.demo-tip{margin-top:14px;padding:10px 12px;border-radius:9px;background:#f8fbfe;border:1px dashed #d5e3f0;font-size:12.5px;color:var(--muted);line-height:1.7}

/* ============================================================
   9. 个人主页
   ============================================================ */
.profile-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.profile-top .avatar{width:62px;height:62px;flex:0 0 62px;font-size:24px;border-radius:16px}
.profile-top h1{font-size:20px;margin-bottom:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 0 16px;flex-wrap:wrap}
.tabs button{
  height:38px;padding:0 16px;border-radius:9px 9px 0 0;color:var(--muted);font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{color:var(--primary)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);background:#f8fbff}
.list-row{
  display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:10px;background:#fff;transition:.15s;
}
.list-row:hover{border-color:#cfe0f0;box-shadow:0 2px 10px rgba(31,41,51,.06)}
.list-row .cover{width:44px;aspect-ratio:3/4;flex:0 0 44px;border-radius:6px}
.list-row .cover .init{font-size:16px}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:700;font-size:14px;margin-bottom:2px}
.list-row .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.interest-box{display:flex;flex-direction:column;gap:12px}
.interest-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.interest-row .t{color:var(--muted);font-size:13px;font-weight:600;padding-top:3px}

/* ============================================================
   10. AI 荐书
   ============================================================ */
.ai-wrap{display:grid;grid-template-columns:288px 1fr;gap:18px;align-items:start}
.ai-side{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;position:sticky;top:78px}
.ai-side .new-topic{width:100%;margin-bottom:12px}
.topic-list{display:flex;flex-direction:column;gap:4px;max-height:62vh;overflow:auto}
.topic-item{
  position:relative;padding:10px 10px;border-radius:9px;cursor:pointer;transition:.14s;border:1px solid transparent;
}
.topic-item:hover{background:#f6f9fc}
.topic-item.active{background:var(--primary-soft);border-color:#cfe0f0}
.topic-item .tt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:46px}
.topic-item .tm{color:var(--muted);font-size:11.5px}

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const NOW = Date.now();
const HOUR = 3600 * 1000;
function ago(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const hh = Math.floor(m / 60);
  if (hh < 24) return hh + ' 小时前';
  const d = Math.floor(hh / 24);
  if (d < 30) return d + ' 天前';
  return fmtDate(ts);
}
function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function maskEmail(email) {
  if (!email) return '—';
  const at = email.indexOf('@');
  if (at <= 0) return email;
  return email[0] + '***' + email.slice(at);
}

  const pinnedOfSolitude = DB.comments.find(c => c.bookId === 6 && c.likes === 1 && c.dislikes === 12);
  const seed = REACTION_SEED.slice();
  if (firstOfSanti) seed.push({ owner: 'demo', key: 'comment:' + firstOfSanti.id, attitude: 'like' });
  if (pinnedOfSolitude) seed.push({ owner: 'demo', key: 'comment:' + pinnedOfSolitude.id, attitude: 'dislike' });
  seed.forEach(s => {
    if (!DB.reactions[s.owner]) DB.reactions[s.owner] = {};

  });
  Object.keys(FAV_SEED).forEach(u => { DB.favorites[u] = FAV_SEED[u].slice(); });

/* Toast */
function toast(html, type) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.innerHTML = html;
  box.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-6px)';
    setTimeout(() => el.remove(), 260);
  }, 2500);
}
function toastLogin() {
  toast('请先登录后再进行该操作 · <a href="#/login">去登录</a>');
}

/* 确认弹窗 / 输入弹窗 */
let modalResolver = null;
function openModal(html, onClose) {
  const root = $('#modal-root');

  root.classList.add('show');
  modalResolver = onClose || null;
}
function closeModal(result) {

/* 渲染后回调队列 */
let afterQueue = [];
function defer(fn) { afterQueue.push(fn); }
function flushDeferred() {
  const q = afterQueue;
  afterQueue = [];
  q.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
}

/* 分页控件（所有列表共用） */
function pager(total, page, pageSize, listKey) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  page = Math.min(Math.max(1, page), pages);
  let nums = '';
  for (let i = 1; i <= pages; i++) {
    if (pages > 9 && i > 3 && i < pages - 1 && Math.abs(i - page) > 1) {
      if (i === 4) nums += '<span class="muted small" style="padding:0 2px">…</span>';
      continue;
    }
    nums += '<button class="' + (i === page ? 'active' : '') + '" data-act="go-page" data-list="' + listKey +
      '" data-page="' + i + '">' + i + '</button>';
  }
  return '<div class="pager">' +
    '<button data-act="go-page" data-list="' + listKey + '" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>' +
    nums +
    '<button data-act="go-page" data-list="' + listKey + '" data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>下一页</button>' +
    '<span class="info">第 ' + page + ' 页 / 共 ' + pages + ' 页</span>' +
    '</div>';
}

/* 收藏 */
function isFav(id) {
  if (!state.user) return false;
  const list = DB.favorites[state.user] || [];
  return list.indexOf(Number(id)) >= 0;
}
function favCount(b) {
  return b.collects + (DB.favDelta[b.id] || 0);
}
function toggleFav(id) {
  if (!state.user) { toastLogin(); return; }
  const book = bookById(id);
  const list = DB.favorites[state.user] || (DB.favorites[state.user] = []);
  const i = list.indexOf(Number(id));
  DB.favDelta[id] = (DB.favDelta[id] || 0);
  if (i >= 0) { list.splice(i, 1); DB.favDelta[id]--; toast('已取消收藏《' + book.title + '》'); }
  else { list.push(Number(id)); DB.favDelta[id]++; toast('已收藏《' + book.title + '》', 'ok'); }
  render();
}

/* 赞 / 踩（图书与评论通用） */
function reactionOf(key) {
  if (!state.user) return null;
  const map = DB.reactions[state.user] || {};
  return map[key] || null;
}
function isLocked(key) {
  if (!state.user) return false;
  const s = DB.lockedTargets[state.user];
  return !!(s && s.has(key));
}
function react(key, attitude, target) {
  // target: {likes, dislikes} 计数对象
  if (!state.user) { toastLogin(); return; }
  if (isLocked(key)) { toast('该操作已取消过，不可再次操作'); return; }
  const map = DB.reactions[state.user] || (DB.reactions[state.user] = {});
  const cur = map[key];
  if (cur === attitude) {
    // 取消
    delete map[key];
    if (attitude === 'like') target.likes = Math.max(0, target.likes - 1);
    else target.dislikes = Math.max(0, target.dislikes - 1);
    DB.lockedTargets[state.user] = DB.lockedTargets[state.user] || new Set();
    DB.lockedTargets[state.user].add(key);
    toast(attitude === 'like' ? '已取消点赞，该对象不可再次操作' : '已取消点踩，该对象不可再次操作');
    render();
    return;
  }
  if (cur && cur !== attitude) { toast('请先取消当前态度'); return; }
  map[key] = attitude;
  if (attitude === 'like') target.likes++;
  else target.dislikes++;
  render();
}

/* 评论工具 */
function topComments(bookId) {
  return DB.comments.filter(c => c.bookId === bookId && !c.parentId);
}
function repliesOf(cid) {
  return DB.comments.filter(c => c.parentId === cid);
}
function isPinned(c) {
  const total = c.likes + c.dislikes;
  return total >= 10 && c.dislikes > 0 && c.likes / c.dislikes <= 0.25;
}
function sortByHot(list) {
  return list.slice().sort((a, b) => (b.likes + b.dislikes) - (a.likes + a.dislikes) || b.likes - a.likes || a.id - b.id);
}
function discussCount(bookId) {
  return DB.comments.filter(c => c.bookId === bookId).length;
}
function deleteComment(id) {
  const idx = DB.comments.findIndex(c => c.id === id);
  if (idx < 0) return;
  DB.comments.splice(idx, 1);
  // 级联删除回复
  const kids = DB.comments.filter(c => c.parentId === id).map(c => c.id);
  kids.forEach(k => deleteComment(k));
}

];
function rankValue(b, key) {
  if (key === 'hot') return b.collects + b.likes;
  if (key === 'collects') return b.collects;

  if (key === 'discuss') return '评论 ' + discussCount(b.id) + '（含回复）';
  return '点踩 ' + b.dislikes;
}
function rankList(key) {

    .sort((a, b) => rankValue(b, key) - rankValue(a, key) || a.id - b.id)
    .slice(0, 100);
}

/* 推荐（猜你喜欢 / 综合推荐） */
function userSignals() {
  const favIds = (state.user && DB.favorites[state.user]) || [];
  const myCmt = state.user ? DB.comments.filter(c => c.user === state.user) : [];
  const interest = (state.user && DB.interests[state.user]) || [];
  const favTags = {};
  favIds.forEach(id => {
    const b = bookById(id);
    if (!b) return;
    Object.keys(b.t).forEach(k => {
      const v = b.t[k];
      if (v !== '中文' && v !== '2020年以前' && v !== '长篇' && v !== '成人') favTags[v] = 1;
    });
  });
  const cmtTags = {};
  myCmt.forEach(c => {
    const b = bookById(c.bookId);
    if (b) { cmtTags[b.t.类型] = 1; cmtTags[b.t.情绪基调] = 1; }
  });
  return { favIds, interest, favTags, cmtTags, myCmt };
}
function scoreBook(b, sig) {
  let s = 0;
  if (sig.interest.indexOf(b.t.类型) >= 0) s += 3;
  if (sig.interest.indexOf(b.t.情绪基调) >= 0) s += 2;
  if (sig.favTags[b.t.类型]) s += 2.5;
  if (sig.cmtTags[b.t.类型]) s += 2;
  s += (b.collects + b.likes) / 40;  // 站内热度归一
  return s;
}
function recommendPool() {
  const sig = userSignals();
  return BOOKS.filter(b => sig.favIds.indexOf(b.id) < 0 && b.t.语言 === '中文')
    .map(b => ({ b, s: scoreBook(b, sig) }))
    .sort((x, y) => y.s - x.s || x.b.id - y.b.id)
    .map(x => x.b);
}
function commentSnippet(bookId) {
  const list = DB.comments.filter(c => c.bookId === bookId);
  if (!list.length) return '暂无人评论';
  const best = sortByHot(list)[0];
  let txt = best.text.replace(/\s+/g, '');
  if (txt.length > 22) txt = txt.slice(0, 22) + '…';
  return txt;
}

/* 路由 */
function parseRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const qAt = raw.indexOf('?');
  const path = qAt >= 0 ? raw.slice(0, qAt) : raw;
  const query = qAt >= 0 ? raw.slice(qAt + 1) : '';
  const seg = path.split('/').filter(Boolean);
  if (!seg.length) return { name: 'home', params: [], query: query };
  return { name: seg[0], params: seg.slice(1), query: query };
}

/* 筛选条件与地址栏同步：刷新、后退、分享链接都能还原已选标签 */
function decodeFilters(qs) {
  const out = {};
  if (!qs) return out;
  qs.split('&').forEach(function (kv) {
    const i = kv.indexOf('=');
    if (i < 0) return;
    const k = decodeURIComponent(kv.slice(0, i));
    const v = decodeURIComponent(kv.slice(i + 1));
    if (k && v) out[k] = v;
  });
  return out;
}

function filtersToQuery(f) {
  const keys = Object.keys(f).filter(function (k) { return f[k]; });
  if (!keys.length) return '';
  return '?' + keys.map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(f[k]);
  }).join('&');
}

function syncFiltersHash() {
  if (state.route !== 'home') return;
  const h = '#/home' + filtersToQuery(state.filters);
  if (location.hash === h) return;
  try { history.replaceState(null, '', h); } catch (e) { /* file:// 下不动地址 */ }
}
function go(hash) {
  if (location.hash === hash) { render(); }
  else location.hash = hash;
}

function randCode() {

  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function drawCaptcha() {
  const cv = $('#captchaCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f7fafd';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = 'rgba(46,92,138,' + (0.10 + Math.random() * 0.18) + ')';
    ctx.beginPath();
    ctx.moveTo(Math.random() * W, Math.random() * H);
    ctx.lineTo(Math.random() * W, Math.random() * H);
    ctx.stroke();
  }
  const colors = ['#2E5C8A', '#8c5a3c', '#2f6f6b', '#7d2b3a'];
  const code = state.register.captcha;
  for (let i = 0; i < code.length; i++) {
    ctx.save();
    ctx.translate(16 + i * 23, H / 2 + 1);
    ctx.rotate((Math.random() - 0.5) * 0.45);
    ctx.font = 'bold 21px Georgia, "Times New Roman", serif';
    ctx.fillStyle = colors[i % colors.length];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(code[i], 0, 0);
    ctx.restore();
  }
  for (let i = 0; i < 24; i++) {
    ctx.fillStyle = 'rgba(46,92,138,.22)';
    ctx.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
  }
}

function ensureTopics() {
  if (!state.aiTopics) {
    const t0 = NOW - 2 * HOUR;
    state.aiTopics = [{
      id: 1,
      title: '想找一本适合睡前读的书',
      ts: t0,
      messages: [
        { role: 'user', text: '最近睡得不太好，想找点轻松的书看看。', ts: t0 - 60000 },
        { role: 'ai', text: '听起来这段时间挺累的。睡前读书不必求“有用”，反而是越松越好：篇幅别太长、情绪别太沉，读几页就能放下。\n我在下面挑了两本适合睡前翻的书，你看合不合口味。', books: [4, 9], ts: t0 }
      ]
    }];
    state.aiTopicId = 1;
  }
  if (!state.aiTopics.find(t => t.id === state.aiTopicId)) state.aiTopicId = state.aiTopics[0].id;
}
function currentTopic() {
  ensureTopics();
  return state.aiTopics.find(t => t.id === state.aiTopicId);
}
function recBooks(n, seed) {
  const pool = recommendPool();
  if (!pool.length) return [];
  const start = (seed * n) % pool.length;
  const out = [];
  for (let i = 0; i < n && i < pool.length; i++) out.push(pool[(start + i) % pool.length]);
  return out;
}
function recReason(b) {
  const sig = userSignals();
  let behavior;
  if (sig.favIds.length) {
    const fv = bookById(sig.favIds[sig.favIds.length - 1]);
    behavior = fv ? '你收藏过《' + fv.title + '》' : '你最近看过几本同类书';
  } else if (sig.interest.length) {
    behavior = '你的兴趣标签里有“' + sig.interest[0] + '”';
  } else {
    behavior = '你还没有填写兴趣偏好';
  }
  return behavior + '；这本《' + b.title + '》是“' + b.t.类型 + '·' + b.t.情绪基调 + '”题材；' +
    '有读者评论提到“' + commentSnippet(b.id) + '”。';
}

function aiBookLine(b) {
  return '《' + b.title + '》是' + b.author + '的' + b.t.类型 + '作品，' + b.t.篇幅 + '，基调偏' + b.t.情绪基调 +
    '，比较适合' + b.t.适合人群 + '读者。';
}
function aiReply(userText) {
  const t = userText.trim();
  /* 1. 命中站内书名 */
  const b = BOOKS.find(x => t.indexOf(x.title) >= 0);
  if (b) {
    const sameType = BOOKS.filter(x => x.id !== b.id && x.t.类型 === b.t.类型).slice(0, 1);
    return {
      text: aiBookLine(b) + '\n站内已有 ' + b.collects + ' 人收藏、' + b.likes + ' 人点赞，讨论 ' + discussCount(b.id) + ' 条。\n' +
        '如果你喜欢这种' + b.t.情绪基调 + '的味道，' + (sameType.length ? '可以接着看《' + sameType[0].title + '》。' : '也可以去榜单看看同类作品。'),
      books: [b].concat(sameType)
    };
  }
  /* 2. 功能讲解 */
  const feat = AI_FEATURES.find(f => f.keys.some(k => t.indexOf(k) >= 0));
  if (feat) return { text: feat.text };
  /* 3. 情绪 / 生活场景 */
  const emo = AI_EMOTIONS.find(e => e.keys.some(k => t.indexOf(k) >= 0));
  if (emo) {
    const picks = BOOKS.filter(x => emo.mood.indexOf(x.t.情绪基调) >= 0)
      .sort((x, y) => (y.collects + y.likes) - (x.collects + x.likes)).slice(0, 2);
    return {
      text: emo.lead + '\n要不先试试这两本？它们都属于“' + emo.mood.join(' / ') + '”这一路，读完不会更沉。',
      books: picks
    };
  }
  /* 4. 与图书无关 */
  if (AI_OFFTOPIC.some(k => t.indexOf(k) >= 0)) {
    return {
      text: '这个问题我帮不上忙——我只能聊图书和本站功能，别的领域容易说错，反而误事。\n不过既然你开口了，要不要换个角度：想解决什么问题，我帮你找本对应的书？比如想静下心、想睡个好觉、想找点刺激，都可以直接说。'
    };
  }
  /* 5. 兜底：按你的档案推荐 */
  const picks = recBooks(2, state.aiSeed + 3);
  if (!picks.length) {
    return { text: '我这边暂时没有足够的图书数据来做推荐。你可以先去首页随便点点、收藏几本，我就能更懂你的口味了。' };
  }
  return {
    text: '我按你的档案挑了两本，理由写在卡片里：\n' + picks.map(p => '· 《' + p.title + '》' + recReason(p)).join('\n'),
    books: picks
  };
}

  if (nc && state.cmtDraft) nc.value = state.cmtDraft;

/* ---------- 路由分发 ---------- */
function render() {
  const r = parseRoute();
  const prevKey = state.renderedKey || '';
  const prevY = window.scrollY || window.pageYOffset || 0;
  state.route = r.name;
  if (r.name === 'book') {
    const nid = Number(r.params[0]);
    if (state.bookId !== nid) {
      state.bookId = nid;
      state.cmtDraft = '';
      state.replyDraft = '';
      state.replyTo = null;
      state.bookCmtPage = 1;
    }
  }

  /* 权限守卫 */
  if (r.name === 'profile' || r.name === 'ai') {
    if (!state.user) { toast('请先登录后再访问该页面 · <a href="#/login">去登录</a>'); location.hash = '#/login'; return; }
  }
  if (r.name === 'admin') {
    if (!state.user) { toast('请先登录 · <a href="#/login">去登录</a>'); location.hash = '#/login'; return; }
    if (!isAdmin()) { toast('仅管理员可访问管理页', 'err'); location.hash = '#/home'; return; }
  }

  /* AI 页：每次新进入时展示一次综合推荐 */
  if (r.name === 'ai') {
    if (state.prevRoute !== 'ai') { state.aiShowRec = true; state.aiSeed = 0; }
    state.prevRoute = 'ai';
  } else {
    state.prevRoute = r.name;
  }

  renderNav();

  let html = '';
  switch (r.name) {
    case 'home': html = renderHome(); break;
    case 'ranking': html = renderRanking(); break;
    case 'book': html = renderBook(); break;
    case 'login': html = renderLogin(); break;
    case 'register': html = renderRegister(); break;
    case 'profile': html = renderProfile(); break;
    case 'ai': html = renderAI(); break;
    case 'admin': html = renderAdmin(); break;
    case 'import': html = renderImport(); break;
    default: html = renderNotFound();
  }
  $('#app').innerHTML = html;
  restoreInputs();
  flushDeferred();

  /* 滚动位置：同一页面内的重绘（点标签、赞踩等）保持原位置，切换页面才回到顶部 */
  const pageKey = r.name + '|' + (r.params || []).join('/');
  if (r.name === 'ai') {
    const body = $('#chatBody');
    if (body) body.scrollTop = body.scrollHeight;
  } else if (pageKey === prevKey) {
    window.scrollTo(0, prevY);
  } else {
    window.scrollTo(0, 0);
  }
  state.renderedKey = pageKey;
}

function doLogin() {
  if (state.lockedUntil > Date.now()) {
    toast('该设备已锁定 24 小时，请稍后再试', 'err');
    return;
  }
  const acc = val('#loginUser');
  const pwd = val('#loginPwd');
  if (!acc || !pwd) { toast('请输入账号和密码'); return; }
  const u = USERS.find(x => (x.username === acc || x.email === acc) && x.password === pwd);
  if (!u) {
    state.loginFails++;
    if (state.loginFails >= 10) {
      state.lockedUntil = Date.now() + 24 * HOUR;
      render();
      toast('连续登录失败 10 次，该设备已锁定 24 小时', 'err');
      return;
    }
    toast('账号不存在或密码错误', 'err');
    return;
  }
  if (u.status === '封禁') { toast('账号已被封禁，请联系管理员', 'err'); return; }
  state.user = u.username;
  state.loginFails = 0;
  state.interestsDraft = null;
  state.recBatch = 0;
  toast('欢迎回来，' + u.username, 'ok');
  location.hash = '#/home';
  render();
}

/* ---------- 注册 ---------- */
function doRegister() {
  const username = val('#regUser');
  const email = val('#regEmail');
  const pwd = val('#regPwd');
  const cap = val('#regCaptcha');
  const agree = state.register.agree;
  const errors = {};

  /* 按 用户名 → 邮箱 → 密码 → 图形码 → 协议 的顺序逐项校验 */
  if (!username) errors.username = '请填写用户名称';
  else if (username.length < 2 || username.length > 12) errors.username = '用户名称需为 2–12 个字符';
  else if (!/^[\u4e00-\u9fa5A-Za-z0-9\-_+=\/*]+$/.test(username)) errors.username = '只能包含中文、字母、数字和 - _ + = / *';
  else if (USERS.some(u => u.username === username)) errors.username = '该用户名称已被注册';

  if (!errors.username) {
    if (!email) errors.email = '请填写邮箱';
    else if (!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/i.test(email)) errors.email = '请填写合法的邮箱地址，如 name@example.com';
    else if (USERS.some(u => u.email.toLowerCase() === email.toLowerCase())) errors.email = '该邮箱已被注册';
  }
  if (!errors.username && !errors.email) {
    if (!pwd) errors.password = '请填写密码';
    else if (pwd.length < 8) errors.password = '密码至少 8 位';
    else if (!/[A-Za-z]/.test(pwd) || !/[0-9]/.test(pwd)) errors.password = '密码需同时包含字母和数字';
  }
  if (!errors.username && !errors.email && !errors.password) {
    if (!cap) errors.captcha = '请输入图形验证码';
    else if (cap.toUpperCase() !== state.register.captcha) errors.captcha = '图形验证码不正确';
  }
  if (!errors.username && !errors.email && !errors.password && !errors.captcha && !agree) {
    errors.agree = '请先阅读并同意用户协议与隐私政策';
  }

  state.register.draft = { regUser: username, regEmail: email, regPwd: pwd };
  const firstKey = Object.keys(errors)[0];
  if (firstKey) {
    state.register.errors = errors;
    state.register.captcha = randCode();
    if (errors.captcha && state.register.draft) state.register.draft.regCaptcha = '';
    render();
    toast(errors[firstKey], 'err');
    return;
  }

  USERS.push({
    username: username, email: email, password: pwd, role: 'user',
    regTime: fmtDateTime(Date.now()), status: '正常'
  });
  state.register = { agree: false, captcha: randCode(), errors: {}, draft: {} };
  state.loginDraft = { user: username, pwd: '' };
  toast('注册成功，请使用新账号登录', 'ok');
  location.hash = '#/login';
  render();
}

/* ---------- AI 发送 ---------- */
function aiSend() {
  const ta = $('#aiInput');
  const text = ta ? ta.value.trim() : '';
  if (!text) { toast('请先输入内容'); return; }
  if (state.aiTyping) { toast('上一条还在思考中，请稍候'); return; }
  const topic = currentTopic();
  state.aiDraft = '';
  topic.messages.push({ role: 'user', text: text, ts: Date.now() });
  topic.ts = Date.now();
  state.aiTyping = true;
  render();
  const delay = 600 + Math.floor(Math.random() * 300);
  setTimeout(function () {
    const rep = aiReply(text);
    const t = currentTopic();
    t.messages.push({ role: 'ai', text: rep.text, books: rep.books || [], ts: Date.now() });
    t.ts = Date.now();
    state.aiTyping = false;
    render();
  }, delay);
}

/* ---------- 导入 ---------- */
function pickImportFile(name) {
  state.importState = { file: name, running: false, done: false, progress: 0, onlyFail: false };
  render();
  toast('已选择文件：' + name);
}
function runImport() {
  if (!state.importState || !state.importState.file) { toast('请先选择数据文件'); return; }
  if (state.importState.running) return;
  state.importState = Object.assign({}, state.importState, { running: true, done: false, progress: 6 });
  render();
  let p = 6;
  const iv = setInterval(function () {
    p += 12 + Math.random() * 18;
    if (p >= 100) {
      p = 100;
      clearInterval(iv);
      finishImport();
      return;
    }
    const bar = $('#importBar');
    if (bar) bar.style.width = p + '%';
    if (state.importState) state.importState.progress = p;
  }, 240);
}
function finishImport() {
  const report = {
    added: 12, updated: 8, skipped: 2, failed: 3,
    failures: [
      { row: 7, title: '《无人生还》', reason: 'ISBN 校验失败：978-7-5327-6 长度不足 13 位' },
      { row: 19, title: '《夜航西飞》', reason: '缺少必填字段：出版社' },
      { row: 34, title: '《小镇喧嚣》', reason: '标签「地域背景」取值不在允许范围内：北美' }
    ]
  };
  state.importState = Object.assign({}, state.importState, {
    running: false, done: true, progress: 100, report: report, onlyFail: false
  });
  render();
  toast('导入完成：新增 12 · 更新 8 · 跳过 2 · 失败 3', 'ok');
}

/* ---------- 全局点击代理 ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  const ds = el.dataset;

  switch (act) {
    /* 通用 */
    case 'open-book':
      location.hash = '#/book/' + id;
      break;
    case 'fav':
      e.stopPropagation();
      toggleFav(id);
      break;
    case 'back':
      history.length > 1 ? history.back() : (location.hash = '#/home');
      break;
    case 'logout':
      confirmDialog({
        title: '退出登录',
        html: '<p>确定要退出当前账号吗？</p>',
        okText: '退出登录'
      }).then(function (ok) {
        if (!ok) return;
        state.user = null;
        state.interestsDraft = null;
        state.recBatch = 0;
        state.replyTo = null;
        toast('已退出登录');
        location.hash = '#/home';
        render();
      });
      break;

    /* 首页筛选 */
    case 'tag': {
      const type = ds.type, value = ds.val;
      if (state.filters[type] === value) delete state.filters[type];
      else state.filters[type] = value;
      state.homePage = 1;
      syncFiltersHash();
      render();
      break;
    }
    case 'untag':
      delete state.filters[ds.type];
      state.homePage = 1;
      syncFiltersHash();
      render();
      break;
    case 'clear-tags':
      state.filters = {};
      state.homePage = 1;
      syncFiltersHash();
      render();
      break;
    case 'rec-more': {
      if (el.classList.contains('is-disabled')) { toast('暂无更多推荐'); return; }
      const pool = recommendPool();
      if ((state.recBatch + 1) * 10 >= pool.length) {
        state.recBatch++;
        render();
        toast('暂无更多推荐');
        return;
      }
      state.recBatch++;
      render();
      break;
    }

    /* 分页 */
    case 'go-page': {
      const key = ds.list, page = Number(ds.page);
      if (key === 'home') state.homePage = page;
      else if (key === 'rank') state.rankPage = page;
      else if (key === 'book-cmt') state.bookCmtPage = page;
      else if (key === 'profile') state.profilePage[state.profileTab] = page;
      else if (key === 'admin') state.adminPage = page;
      render();
      break;
    }

    /* 榜单 */
    case 'rank-tab':
      if (state.rankTab !== ds.key) {
        state.rankTab = ds.key;
        state.rankPage = 1;
      }
      render();
      break;

    /* 详情页 */
    case 'book-like': {
      const b = bookById(id);
      react('book:' + b.id, 'like', b);
      break;
    }
    case 'book-dislike': {
      const b = bookById(id);
      react('book:' + b.id, 'dislike', b);
      break;
    }
    case 'resource': {
      const b = bookById(id);
      window.open(resourceUrl(b), '_blank');
      break;
    }
    case 'cmt-sort':
      state.cmtSort = ds.sort;
      state.bookCmtPage = 1;
      render();
      break;
    case 'c-like': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (c) react('comment:' + c.id, 'like', c);
      break;
    }
    case 'c-dislike': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (c) react('comment:' + c.id, 'dislike', c);
      break;
    }
    case 'c-reply':
      if (!state.user) { toastLogin(); return; }
      state.replyTo = (state.replyTo === Number(id)) ? null : Number(id);
      render();
      defer(function () {
        const box = $('#replyInput');
        if (box) box.focus();
      });
      break;
    case 'c-reply-cancel':
      state.replyTo = null;
      render();
      break;
    case 'c-reply-submit': {
      if (!state.user) { toastLogin(); return; }
      const box = $('#replyInput');
      const txt = box ? box.value.trim() : '';
      if (!txt) { toast('回复内容不能为空'); return; }
      const parent = DB.comments.find(x => x.id === Number(id));
      if (!parent) return;
      DB.comments.push({
        id: Math.max.apply(null, DB.comments.map(c => c.id)) + 1,
        bookId: parent.bookId, user: state.user, text: txt,
        ts: Date.now(), likes: 0, dislikes: 0, parentId: parent.id
      });
      state.replyTo = null;
      state.replyDraft = '';
      toast('回复已发表', 'ok');
      render();
      break;
    }
    case 'c-submit': {
      if (!state.user) { toastLogin(); return; }
      const box = $('#newComment');
      const txt = box ? box.value.trim() : '';
      if (!txt) { toast('评论内容不能为空'); return; }
      DB.comments.push({
        id: Math.max.apply(null, DB.comments.map(c => c.id)) + 1,
        bookId: Number(ds.book), user: state.user, text: txt,
        ts: Date.now(), likes: 0, dislikes: 0, parentId: null
      });
      state.cmtSort = 'hot';
      state.bookCmtPage = 1;
      state.cmtDraft = '';
      toast('评论已发表', 'ok');
      render();
      break;
    }
    case 'c-del': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (!c) return;
      const kids = repliesOf(c.id).length;
      confirmDialog({
        title: '删除评论',
        html: '确定删除这条评论吗？' + (kids ? '该评论下的 <b>' + kids + '</b> 条回复也会一并删除。' : ''),
        okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        deleteComment(c.id);
        toast('评论已删除');
        render();
      });
      break;
    }

    /* 登录 / 注册 */
    case 'toggle-pwd':
      state.showPwd = !state.showPwd;
      render();
      break;
    case 'do-login':
      doLogin();
      break;
    case 'toggle-agree':
      state.register.agree = !state.register.agree;
      render();
      break;
    case 'captcha-refresh':
      state.register.captcha = randCode();
      render();
      break;
    case 'do-register':
      doRegister();
      break;

    /* 个人主页 */
    case 'profile-tab':
      state.profileTab = ds.tab;
      render();
      break;
    case 'interest': {
      const v = ds.val;
      const arr = state.interestsDraft || (state.interestsDraft = []);
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1); else arr.push(v);
      render();
      break;
    }
    case 'interest-save': {
      DB.interests[state.user] = (state.interestsDraft || []).slice();
      toast('兴趣偏好已保存', 'ok');
      render();
      break;
    }
    case 'interest-reset':
      state.interestsDraft = (DB.interests[state.user] || []).slice();
      render();
      break;
    case 'fav-del': {
      const b = bookById(id);
      confirmDialog({
        title: '取消收藏', html: '确定把《' + esc(b.title) + '》从我的收藏中删除吗？',
        okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        const list = DB.favorites[state.user] || [];
        const i = list.indexOf(Number(id));
        if (i >= 0) list.splice(i, 1);
        DB.favDelta[id] = (DB.favDelta[id] || 0) - 1;
        toast('已从收藏中移除');
        render();
      });
      break;
    }
    case 'myc-del': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (!c) return;
      confirmDialog({
        title: '删除评论', html: '删除后该评论下的回复也会一并删除，确定继续？',
        okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        deleteComment(c.id);
        toast('评论已删除');
        render();
      });
      break;
    }
    case 'myr-del': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (!c) return;
      confirmDialog({
        title: '删除回复', html: '确定删除这条回复吗？', okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        DB.comments = DB.comments.filter(x => x.id !== c.id);
        toast('回复已删除');
        render();
      });
      break;
    }

    /* AI 荐书 */
    case 'ai-new-topic': {
      ensureTopics();
      const nid = Math.max.apply(null, state.aiTopics.map(t => t.id)) + 1;
      state.aiTopics.unshift({
        id: nid,
        title: '新话题 ' + (state.aiTopics.length + 1),
        ts: Date.now(),
        messages: [{
          role: 'ai',
          text: '这是新的话题。想聊点什么？可以说说最近的心情，或者直接报一个书名，我来讲讲它适合谁。',
          ts: Date.now()
        }]
      });
      state.aiTopicId = nid;
      state.aiShowRec = false;
      state.aiDraft = '';
      render();
      break;
    }
    case 'ai-topic':
      state.aiTopicId = Number(id);
      state.aiShowRec = false;
      state.aiDraft = '';
      render();
      break;
    case 'ai-rename': {
      e.stopPropagation();
      const t = state.aiTopics.find(x => x.id === Number(id));
      if (!t) return;
      promptDialog({ title: '重命名话题', label: '话题标题', value: t.title }).then(v => {
        if (v === null) return;
        if (!v.trim()) { toast('标题不能为空'); return; }
        t.title = v.trim().slice(0, 30);
        render();
        toast('话题已重命名');
      });
      break;
    }
    case 'ai-del-topic': {
      e.stopPropagation();
      const t = state.aiTopics.find(x => x.id === Number(id));
      if (!t) return;
      confirmDialog({
        title: '删除话题',
        html: '删除「' + esc(t.title) + '」后，该话题下的全部聊天记录都会被清空，且不可恢复。',
        okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        state.aiTopics = state.aiTopics.filter(x => x.id !== t.id);
        if (!state.aiTopics.length) {
          state.aiTopics.push({
            id: Date.now(), title: '新话题', ts: Date.now(),
            messages: [{ role: 'ai', text: '话题已清空，重新开始吧——想聊哪本书？', ts: Date.now() }]
          });
        }
        state.aiTopicId = state.aiTopics[0].id;
        toast('话题及其记录已删除');
        render();
      });
      break;
    }
    case 'ai-send':
      aiSend();
      break;
    case 'ai-rec-more':
      state.aiSeed++;
      render();
      toast('已为你换一批推荐');
      break;

    /* 管理 */
    case 'admin-tab':
      state.adminTab = ds.tab;
      state.adminPage = 1;
      render();
      break;
    case 'admin-del': {
      const c = DB.comments.find(x => x.id === Number(id));
      if (!c) return;
      const kids = repliesOf(c.id).length;
      confirmDialog({
        title: '删除评论',
        html: '确定删除 ' + esc(c.user) + ' 的这条' + (c.parentId ? '回复' : '评论') + '吗？' +
          (kids ? '其下 <b>' + kids + '</b> 条回复会一并删除。' : ''),
        okText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        deleteComment(c.id);
        toast('已删除');
        render();
      });
      break;
    }
    case 'ban': {
      const name = ds.user;
      if (name === state.user) { toast('不能封禁自己', 'err'); return; }
      if (userRole(name) === 'admin') { toast('不能封禁管理员', 'err'); return; }
      confirmDialog({
        title: '封禁用户', html: '封禁后 <b>' + esc(name) + '</b> 将无法登录，确定继续？',
        okText: '封禁', danger: true
      }).then(ok => {
        if (!ok) return;
        const u = userByName(name);
        if (u) u.status = '封禁';
        toast('已封禁 ' + name);
        render();
      });
      break;
    }
    case 'unban': {
      const name = ds.user;
      confirmDialog({
        title: '解封用户', html: '确定解除 <b>' + esc(name) + '</b> 的封禁状态？',
        okText: '解封'
      }).then(ok => {
        if (!ok) return;
        const u = userByName(name);
        if (u) u.status = '正常';
        toast('已解封 ' + name);
        render();
      });
      break;
    }

    /* 导入 */
    case 'import-pick': {
      const inp = $('#importFile');
      if (inp) inp.click();
      break;
    }
    case 'import-demo':
      pickImportFile('图书数据_2025Q4.csv');
      break;
    case 'import-run':
      runImport();
      break;
    case 'import-only-fail':
      if (state.importState && state.importState.done) {
        state.importState.onlyFail = !state.importState.onlyFail;
        render();
      }
      break;

    /* 弹窗 */
    case 'modal-cancel':
      closeModal(false);
      break;
    case 'modal-ok':
      closeModal(true);
      break;
    case 'modal-prompt-ok': {
      const inp = $('#promptInput');
      closeModal(inp ? inp.value : '');
      break;
    }
    default:
      break;
  }
});

/* 回车与输入事件 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'loginUser') { e.preventDefault(); $('#loginPwd').focus(); }
  else if (id === 'loginPwd') { e.preventDefault(); doLogin(); }
  else if (id === 'aiInput' && !e.shiftKey) { e.preventDefault(); aiSend(); }
  else if (id === 'promptInput') {
    e.preventDefault();
    closeModal(e.target.value);
  } else if (id === 'regCaptcha') { e.preventDefault(); doRegister(); }
});

/* 文件选择（动态元素，用委托） */
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'importFile') {
    const f = e.target.files && e.target.files[0];
    pickImportFile(f ? f.name : '未命名文件.csv');
  }
});

/* 输入内容临时保存，避免重渲染丢失 */
document.addEventListener('input', function (e) {
  if (e.target.id === 'aiInput') state.aiDraft = e.target.value;
  if (e.target.id === 'newComment') state.cmtDraft = e.target.value;
  if (e.target.id === 'replyInput') state.replyDraft = e.target.value;
  if (e.target.id === 'loginUser' || e.target.id === 'loginPwd') {
    state.loginDraft = state.loginDraft || {};
    state.loginDraft[e.target.id === 'loginUser' ? 'user' : 'pwd'] = e.target.value;
  }
  if (e.target.id === 'regUser' || e.target.id === 'regEmail' || e.target.id === 'regPwd' ||
    e.target.id === 'regCaptcha') {
    state.register.draft = state.register.draft || {};
    state.register.draft[e.target.id] = e.target.value;
  }
});

/* 弹窗遮罩点击关闭 */
$('#modal-root').addEventListener('click', function (e) {
  if (e.target.id === 'modal-root') closeModal(false);
});

/* ---------- 启动 ---------- */
window.addEventListener('hashchange', function () { render(); });

state.register.captcha = randCode();
ensureTopics();
if (!location.hash) location.hash = '#/home';
(function restoreFilters() {
  const q = parseRoute().query;
  if (q) {
    const f = decodeFilters(q);
    if (Object.keys(f).length) state.filters = f;
  }
})();
render();
