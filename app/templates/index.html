{% extends 'base.html' %} {% block content %}
<section class="panel qa-panel">
  <div class="section-head">
    <div>
      <h1>简单问答找书</h1>
      <p class="muted">告诉我你想读什么，系统会从标签中提取偏好并生成推荐。</p>
    </div>
  </div>
  <form id="qaForm" class="qa-form">
    <textarea
      id="qaPrompt"
      rows="3"
      maxlength="1000"
      placeholder="例如：我想看历史背景浓厚、篇幅较长的中国作品"
    ></textarea>
    <div class="qa-form-footer">
      <span class="muted">问答会参考当前标签集合进行匹配</span>
      <button class="btn btn-primary" type="submit" id="qaSubmit">
        开始推荐
      </button>
    </div>
  </form>
  <div id="qaStatus" class="muted"></div>
  <div id="qaRecommendations" hidden>
    <div class="section-head"><h2>问答推荐</h2></div>
    <div id="qaKeywords" class="qa-keywords"></div>
    <div id="qaBooks" class="book-grid"></div>
  </div>
</section>
<section id="recommendSection" class="panel" hidden>
  <div class="section-head">
    <div>
      <h2>猜你喜欢</h2>
      <span class="muted">根据兴趣标签、收藏书籍标签、评论和全站热度生成</span>
    </div>
    <button class="btn btn-outline" id="recommendMore">换一批</button>
  </div>
  <div id="recommendBooks" class="book-grid"></div>
</section>
{% endblock %} {% block scripts %}
<script>
  window.BRS.page = "home";
</script>
<script
  type="module"
  src="{{ url_for('static', filename='js/qa.js') }}"
></script>
{% endblock %}
