{% extends 'base.html' %}{% block content %}
<section class="hero">
  <h1>发现下一本值得读的书</h1>
  <p>按标签筛选图书，查看详情并参与讨论。</p>
</section>
<section id="recommendSection" class="panel" hidden>
  <div class="section-head">
    <div>
      <h2>猜你喜欢</h2>
      <span class="muted">根据兴趣、收藏、评论和全站热度生成</span>
    </div>
    <button class="btn btn-outline" id="recommendMore">换一批</button>
  </div>
  <div id="recommendBooks" class="book-grid"></div>
</section>
<section class="panel">
  <div class="section-head"><h2>标签筛选</h2></div>
  <div id="tags" class="filter-box">加载中…</div>
</section>
<section>
  <div class="section-head">
    <h2>图书列表</h2>
    <span id="bookTotal"></span>
  </div>
  <div id="books" class="book-grid">加载中…</div>
  <div id="pager"></div>
</section>
{% endblock %}{% block scripts %}
<script>
  window.BRS.page = "home";
</script>
{% endblock %}
