<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>图书推荐系统</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="/">图书推荐系统</a>
      <nav>
        <a href="/">首页</a><a href="/filters">图书筛选</a
        ><a href="/ranking">榜单</a><a href="/login" id="loginLink">登录</a
        ><a href="/register" id="registerLink">注册</a
        ><a href="/profile" id="profileLink" hidden>个人主页</a
        ><a href="/favorites" id="favoritesLink" hidden>我的收藏</a
        ><a href="/my-comments" id="myCommentsLink" hidden>我的评论</a
        ><button id="logoutBtn" hidden>退出</button>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <div id="toast"></div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
